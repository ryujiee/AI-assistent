services:
  postgres:
    image: postgres:15-alpine
    container_name: secretary_postgres
    restart: always
    # The cluster was initialized with TimeZone = UTC in postgresql.conf, and
    # that file is not rewritten by the TZ variable below. This flag makes psql
    # sessions and CURRENT_TIMESTAMP defaults agree with the application.
    command: postgres -c timezone=America/Sao_Paulo -c log_timezone=America/Sao_Paulo
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-secretary_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-secretary_password}
      POSTGRES_DB: ${POSTGRES_DB:-secretary_db}
      TZ: America/Sao_Paulo
    ports:
      # Local access only (the database also holds the WhatsApp session keys).
      - "127.0.0.1:5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Optional admin UI: docker compose --profile tools up -d pgadmin
  pgadmin:
    image: dpage/pgadmin4
    container_name: secretary_pgadmin
    profiles: ["tools"]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-}
      TZ: America/Sao_Paulo
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      - postgres

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: secretary_backend
    restart: always
    ports:
      # Served to the internet through the reverse proxy (nginx) only.
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-secretary_user}:${POSTGRES_PASSWORD:-secretary_password}@postgres:5432/${POSTGRES_DB:-secretary_db}?sslmode=disable
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Panel login. Without ADMIN_PASSWORD (12+ chars) the panel stays locked.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Finance module switch. Tables are created only by "secretary migrate apply".
      FINANCE_ENABLED: ${FINANCE_ENABLED:-false}
      WHATSAPP_LOG_LEVEL: ${WHATSAPP_LOG_LEVEL:-INFO}
      PORT: 8000
      TZ: America/Sao_Paulo
    depends_on:
      - postgres

volumes:
  postgres_data:
